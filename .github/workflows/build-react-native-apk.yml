name: Build React Native Android APK

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android-apk:
    name: Build Credics Android APK (React Native)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Patch React Native C++ std::format Compatibility
        run: |
          node scripts/patch-rn-cpp.js

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Ensure Android Project Ready
        run: |
          if [ ! -d "apps/mobile/android" ]; then
            cd apps/mobile
            npx expo prebuild --platform android --no-install
            cd ../..
          else
            echo "✅ Native Android project already configured"
          fi

      - name: Setup Keystore & Build Android APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'credics123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'credics' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'credics123456' }}
          GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=120000 -Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.repository.max.retries=10 -Dorg.gradle.internal.repository.initial.backoff=1000 -Dhttp.keepAlive=false -Dorg.gradle.jvmargs='-Xmx4096m -XX:MaxMetaspaceSize=1024m'"
        run: |
          KEYSTORE_PATH="$(pwd)/apps/web/android/app/credics-release.jks"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "✅ Using release keystore from $KEYSTORE_PATH"
            cp "$KEYSTORE_PATH" apps/mobile/android/app/credics-release.jks
          fi

          cd apps/mobile/android
          chmod +x gradlew

          patch_rn_headers() {
            echo "🔧 [CI Patch] Running patch-rn-cpp.js..."
            node ../../../scripts/patch-rn-cpp.js || true
            node ./scripts/patch-rn-cpp.js || true
            echo "🔧 [CI Patch] Searching and patching graphicsConversions.h in ~/.gradle..."
            find /home/runner/.gradle -name "graphicsConversions.h" -exec sed -i 's/return std::format("{}%", dimension.value);/return std::to_string(dimension.value) + "%";/g' {} + 2>/dev/null || true
            find /home/runner/.gradle -name "graphicsConversions.h" -exec sed -i 's/std::format("{}%", dimension.value)/std::to_string(dimension.value) + "%"/g' {} + 2>/dev/null || true
            echo "🔧 [CI Patch] Header patch step complete."
          }

          echo "▶ Triggering dependency pre-download..."
          ./gradlew :app:generateReleaseBuildConfig --dry-run || true
          patch_rn_headers

          MAX_RETRIES=3
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "▶ Starting Gradle build attempt $attempt of $MAX_RETRIES..."
            patch_rn_headers
            if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
              ./gradlew assembleRelease \
                -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
                -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
                -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
                -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" \
                --no-daemon --stacktrace && break
            else
              ./gradlew assembleDebug --no-daemon --stacktrace && break
            fi

            if [ $attempt -eq $MAX_RETRIES ]; then
              echo "❌ All $MAX_RETRIES build attempts failed."
              exit 1
            fi
            echo "⚠️ Gradle attempt $attempt encountered failure. Re-patching headers and retrying in 15 seconds..."
            patch_rn_headers
            sleep 15
          done
          cd ../../..

      - name: Find and Stage APK
        run: |
          mkdir -p build_output
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version || '1.0.0'")
          APK_NAME="Credics-v${VERSION}.apk"
          echo "APP_VERSION=${VERSION}" >> $GITHUB_ENV
          echo "APK_FILENAME=${APK_NAME}" >> $GITHUB_ENV
          find apps/mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} "build_output/${APK_NAME}" \;
          echo "✅ Staged APK: build_output/${APK_NAME}"

      - name: Verify APK Signature
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            apksigner verify --verbose "build_output/${{ env.APK_FILENAME }}" || echo "Sign check done"
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Credics-v${{ env.APP_VERSION }}
          path: build_output/Credics-v*.apk
          retention-days: 14

