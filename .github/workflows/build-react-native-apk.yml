name: Build React Native Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android-apk:
    name: Build Credics Android APK (React Native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Expo Prebuild (Generate Android Native Project)
        run: |
          cd apps/mobile
          npx expo prebuild --platform android --clean
          cd ../..

      - name: Setup Keystore & Build Android APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'credics123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'credics' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'credics123456' }}
        run: |
          KEYSTORE_PATH="$(pwd)/apps/web/android/app/credics-release.jks"
          if [ -f "$KEYSTORE_PATH" ]; then
            echo "✅ Using release keystore from $KEYSTORE_PATH"
            cp "$KEYSTORE_PATH" apps/mobile/android/app/credics-release.jks
          fi

          cd apps/mobile/android
          chmod +x gradlew
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="${KEYSTORE_PASSWORD}" \
              -Pandroid.injected.signing.key.alias="${KEY_ALIAS}" \
              -Pandroid.injected.signing.key.password="${KEY_PASSWORD}" \
              --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi
          cd ../../..

      - name: Find and Stage APK
        run: |
          mkdir -p build_output
          find apps/mobile/android/app/build/outputs/apk -name "*.apk" -exec cp {} build_output/credics-react-native.apk \;
          echo "✅ Staged APK: build_output/credics-react-native.apk"

      - name: Verify APK Signature
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            apksigner verify --verbose build_output/credics-react-native.apk || echo "Sign check done"
          fi

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: credics-react-native-apk
          path: build_output/credics-react-native.apk
          retention-days: 14
