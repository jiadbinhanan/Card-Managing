name: Build Android APK

on:
  workflow_dispatch: # Manual trigger only from GitHub Actions UI

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Next.js & Sync Capacitor
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mredhrvxhcdhityoouxa.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_thhGWSDaCViFfi7ym-do1g_EN4WHHb9' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'dummy_for_build' }}
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          pnpm cap:build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/web/android/**/*.gradle*', 'apps/web/android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradlew Executable
        run: chmod +x apps/web/android/gradlew

      - name: Decode Release Keystore (if provided via Secret)
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Decoding keystore from RELEASE_KEYSTORE_BASE64 secret..."
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > apps/web/android/app/credics-release.jks
          elif [ -f "apps/web/android/app/credics-release.jks" ]; then
            echo "Using repository credics-release.jks"
          else
            echo "Error: No release keystore found!"
            exit 1
          fi

      - name: Build Signed Release APK with Gradle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'credics123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'credics' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'credics123456' }}
        run: |
          cd apps/web/android
          ./gradlew assembleRelease --no-daemon
          cd ../../..
          if [ -f "apps/web/android/app/build/outputs/apk/release/credics.apk" ]; then
            echo "✅ credics.apk (release) generated successfully"
          elif [ -f "apps/web/android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp apps/web/android/app/build/outputs/apk/release/app-release.apk apps/web/android/app/build/outputs/apk/release/credics.apk
            echo "✅ Copied app-release.apk to credics.apk"
          fi

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: credics
          path: apps/web/android/app/build/outputs/apk/release/credics.apk
          retention-days: 14
