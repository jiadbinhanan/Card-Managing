// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = findProperty('android.buildToolsVersion') ?: '36.0.0'
        minSdkVersion = Integer.parseInt(findProperty('android.minSdkVersion') ?: '24')
        compileSdkVersion = Integer.parseInt(findProperty('android.compileSdkVersion') ?: '36')
        targetSdkVersion = Integer.parseInt(findProperty('android.targetSdkVersion') ?: '34')
        kotlinVersion = findProperty('android.kotlinVersion') ?: '2.1.20'

        ndkVersion = "26.1.10909125"
    }
    repositories {
        google()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
    }
    dependencies {
        classpath('com.android.tools.build:gradle')
        classpath('com.facebook.react:react-native-gradle-plugin')
        classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
    }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        maven {
            // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
            url(new File(['node', '--print', "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), '../android'))
        }
        maven {
            // Android JSC is installed from npm
            url(new File(['node', '--print', "require.resolve('jsc-android/package.json', { paths: [require.resolve('react-native/package.json')] })"].execute(null, rootDir).text.trim(), '../dist'))
        }

        google()
        mavenCentral()
        maven { url 'https://plugins.gradle.org/m2/' }
        maven { url 'https://www.jitpack.io' }
    }

    def patchGraphicsConversions = {
        def patchFile = { File file ->
            if (file.name == 'graphicsConversions.h' && file.isFile()) {
                try {
                    def text = file.text
                    if (text.contains('std::format')) {
                        file.text = text.replaceAll(/std::format\s*\(\s*["']\{\}%["']\s*,\s*dimension\.value\s*\)/, 'std::to_string(dimension.value) + "%"')
                        println "[Gradle Hook] Successfully patched: ${file.absolutePath}"
                    }
                } catch (Exception e) {
                    println "[Gradle Hook] Could not patch ${file.absolutePath}: ${e.message}"
                }
            }
        }

        def candidateDirs = [
            gradle.gradleUserHomeDir != null ? new File(gradle.gradleUserHomeDir, "caches") : null,
            new File(System.getProperty("user.home"), ".gradle/caches"),
            new File("/home/runner/.gradle/caches"),
            rootDir
        ]

        candidateDirs.findAll { it != null && it.exists() }.each { dir ->
            try {
                dir.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                    if (f.name == 'graphicsConversions.h') {
                        patchFile(f)
                    }
                }
            } catch (Exception ignored) {}
        }
    }

    def findPatchScript = {
        def candidates = [
            new File(rootDir, "scripts/patch-rn-cpp.js"),
            new File(rootDir.parentFile, "scripts/patch-rn-cpp.js"),
            new File(rootDir.parentFile.parentFile, "scripts/patch-rn-cpp.js"),
            new File(rootDir.parentFile.parentFile.parentFile, "scripts/patch-rn-cpp.js")
        ]
        return candidates.find { it.exists() }
    }

    afterEvaluate { project ->
        project.tasks.configureEach { task ->
            def tName = task.name.toLowerCase()
            if (tName.contains("cmake") || tName.contains("externalnativebuild") || tName.contains("prefab") || tName.contains("nativelibs")) {
                task.doFirst {
                    println "[Gradle Hook] Checking & patching C++ headers before task: ${task.name}"
                    patchGraphicsConversions()
                    def scriptFile = findPatchScript()
                    if (scriptFile != null) {
                        project.exec {
                            workingDir scriptFile.parentFile
                            if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
                                commandLine("cmd", "/c", "node scripts/patch-rn-cpp.js")
                            } else {
                                commandLine("node", "scripts/patch-rn-cpp.js")
                            }
                        }
                    }
                }
            }
        }
    }
}
